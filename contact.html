    <h1 class="title">Contact Me</h1>

    <form action="https://formspree.io/f/xreebpog" method="POST" class="contact-form">
        <label>
        Name
            <input type="text" name="name" autocomplete="name" required>
        </label>
    
        <label>
        Email
            <input type="email" name="email" autocomplete="email" required>
        </label>
    
        <label>
        Message
            <textarea name="message" rows="6" required></textarea>
        </label>
        
        <input type="hidden" name="_next" value="https://riagamosa.github.io/portfolio/thanks.html">
    
        <button type="submit" class="view">Send Message</button>
  </form>
